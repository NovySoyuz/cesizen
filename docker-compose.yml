services:

  # ─── Base de données MySQL ───────────────────────────────────────
  cesizen-db:
    image: mysql:8.4
    container_name: cesizen-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-cesizen}
      MYSQL_USER: ${DB_USER:-cesizen}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cesizen}
    ports:
      - "3307:3306"
    volumes:
      - cesizen-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cesizen-network

  # ─── Backend Spring Boot ─────────────────────────────────────────
  cesizen-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cesizen-api
    restart: unless-stopped
    depends_on:
      cesizen-db:
        condition: service_healthy
    environment:
      DB_HOST: cesizen-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cesizen}
      DB_USER: ${DB_USER:-cesizen}
      DB_PASSWORD: ${DB_PASSWORD:-cesizen}
      JWT_SECRET: ${JWT_SECRET:-cesizen-super-secret-key-change-in-production-min-256bits}
    ports:
      - "8080:8080"
    networks:
      - cesizen-network

  # ─── Frontend React ──────────────────────────────────────────────
  cesizen-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cesizen-web
    restart: unless-stopped
    depends_on:
      - cesizen-api
    ports:
      - "3000:80"
    networks:
      - cesizen-network
    profiles:
      - front  # Activé uniquement avec : docker compose --profile front up

  # ─── SonarQube (analyse de qualité de code) ──────────────────────
  sonarqube-db:
    image: postgres:16-alpine
    container_name: cesizen-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
    volumes:
      - cesizen-sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - cesizen-network
    profiles:
      - sonar

  sonarqube:
    image: sonarqube:community
    container_name: cesizen-sonarqube
    restart: unless-stopped
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - cesizen-sonarqube-data:/opt/sonarqube/data
      - cesizen-sonarqube-extensions:/opt/sonarqube/extensions
      - cesizen-sonarqube-logs:/opt/sonarqube/logs
    networks:
      - cesizen-network
    profiles:
      - sonar

volumes:
  cesizen-db-data:
  cesizen-sonarqube-db-data:
  cesizen-sonarqube-data:
  cesizen-sonarqube-extensions:
  cesizen-sonarqube-logs:

networks:
  cesizen-network:
    name: cesizen-network
    driver: bridge
