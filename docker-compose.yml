services:

  # ─── Base de données MySQL ───────────────────────────────────────
  cesizen-db:
    image: mysql:8.4
    container_name: cesizen-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-cesizen}
      MYSQL_USER: ${DB_USER:-cesizen}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cesizen}
    ports:
      - "3307:3306"
    volumes:
      - cesizen-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cesizen-network

  # ─── Backend Spring Boot ─────────────────────────────────────────
  cesizen-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cesizen-api
    restart: unless-stopped
    depends_on:
      cesizen-db:
        condition: service_healthy
    environment:
      DB_HOST: cesizen-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cesizen}
      DB_USER: ${DB_USER:-cesizen}
      DB_PASSWORD: ${DB_PASSWORD:-cesizen}
      JWT_SECRET: ${JWT_SECRET:-cesizen-super-secret-key-change-in-production-min-256bits}
    ports:
      - "8080:8080"
    networks:
      - cesizen-network

  # ─── Frontend React ──────────────────────────────────────────────
  cesizen-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cesizen-web
    restart: unless-stopped
    depends_on:
      - cesizen-api
    ports:
      - "3000:80"
    networks:
      - cesizen-network
    profiles:
      - front  # Activé uniquement avec : docker compose --profile front up

volumes:
  cesizen-db-data:

networks:
  cesizen-network:
    name: cesizen-network
    driver: bridge
