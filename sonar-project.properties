# ─── Configuration SonarQube - Projet CESIZen ────────────────────
sonar.projectKey=cesizen
sonar.projectName=CESIZen
sonar.projectVersion=1.0

# Racine du projet (chemins ci-dessous relatifs à ce fichier)
sonar.sourceEncoding=UTF-8

# ─── Modules ──────────────────────────────────────────────────────
sonar.modules=api,web

# --- Backend (Spring Boot / Java) ---
api.sonar.projectName=CESIZen API
api.sonar.projectBaseDir=apps/api
api.sonar.sources=src/main/java
api.sonar.tests=src/test/java
api.sonar.java.binaries=target/classes
api.sonar.java.test.binaries=target/test-classes
api.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Frontend (React / TypeScript) ---
web.sonar.projectName=CESIZen Web
web.sonar.projectBaseDir=apps/web
web.sonar.sources=src
web.sonar.exclusions=**/*.test.ts,**/*.test.tsx,node_modules/**,android/**,dist/**,build/**

