spring.application.name=cesizen

# ==================== DataSource ====================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cesizen}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:cesizen}
spring.datasource.password=${DB_PASSWORD:cesizen}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT

# ==================== Liquibase ====================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# ==================== JWT ====================
app.jwt.secret=${JWT_SECRET:cesizen-super-secret-key-change-in-production-min-256bits}
app.jwt.expiration-ms=3600000

# ==================== Server ====================
server.port=8080

# ==================== Logging ====================
logging.level.com.cesizen.cesizenapi=DEBUG
logging.level.org.springframework.security=DEBUG
